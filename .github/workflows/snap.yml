# .github/workflows/snap.yml
name: Snap Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-snap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build snap
        id: build
        uses: snapcore/action-build@v1

      - name: Upload snap
        uses: actions/upload-artifact@v4
        with:
          name: drafting-snap
          path: ${{ steps.build.outputs.snap }}
